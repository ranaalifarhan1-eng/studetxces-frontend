<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Interactive presentation screen / teacher classroom -->
  <rect x="8" y="9" width="32" height="22" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="24" y1="31" x2="24" y2="38" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="38" x2="32" y2="38" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Content on screen: play button & lesson analytics -->
  <circle cx="24" cy="20" r="6" fill="#f59e0b"/>
  <polygon points="22.5,17 22.5,23 27,20" fill="#ffffff"/>
  <!-- Graduation star badge -->
  <circle cx="36" cy="11" r="7" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="36,7 37.2,9.8 40,10.2 38,12.2 38.5,15 36,13.6 33.5,15 34,12.2 32,10.2 34.8,9.8" fill="#ffffff"/>
</svg>
