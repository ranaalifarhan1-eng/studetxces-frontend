<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="14" fill="#1e3a8a"/>
  <!-- Financial Calculator / Ledger terminal -->
  <rect x="13" y="10" width="22" height="28" rx="4" fill="#ffffff"/>
  <rect x="16" y="13" width="16" height="6" rx="2" fill="#0f172a"/>
  <text x="30" y="18" font-family="monospace" font-size="5" fill="#38bdf8" text-anchor="end">PKR</text>
  <!-- Calculator key grid -->
  <circle cx="18" cy="23" r="1.5" fill="#94a3b8"/>
  <circle cx="24" cy="23" r="1.5" fill="#94a3b8"/>
  <circle cx="30" cy="23" r="1.5" fill="#3b82f6"/>
  <circle cx="18" cy="28" r="1.5" fill="#94a3b8"/>
  <circle cx="24" cy="28" r="1.5" fill="#94a3b8"/>
  <circle cx="30" cy="28" r="1.5" fill="#3b82f6"/>
  <circle cx="18" cy="33" r="1.5" fill="#94a3b8"/>
  <circle cx="24" cy="33" r="1.5" fill="#10b981"/>
  <circle cx="30" cy="33" r="1.5" fill="#10b981"/>
  <!-- Currency badge on bottom right -->
  <circle cx="36" cy="36" r="7" fill="#10b981" stroke="#1e3a8a" stroke-width="2"/>
  <text x="36" y="39" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">Rs</text>
</svg>
