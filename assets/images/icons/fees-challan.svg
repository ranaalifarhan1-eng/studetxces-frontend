<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#ecfdf5"/>
  <rect x="10" y="8" width="28" height="32" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <!-- Top header bar of challan -->
  <path d="M10 14h28" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <rect x="14" y="11" width="8" height="1.5" rx="0.75" fill="#047857"/>
  <!-- 3 perforations representing 3-part challan -->
  <line x1="10" y1="22" x2="38" y2="22" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="10" y1="30" x2="38" y2="30" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Content lines -->
  <rect x="14" y="17" width="12" height="2" rx="1" fill="#065f46"/>
  <rect x="30" y="17" width="4" height="2" rx="1" fill="#10b981"/>
  <rect x="14" y="25" width="10" height="2" rx="1" fill="#64748b"/>
  <rect x="30" y="25" width="4" height="2" rx="1" fill="#10b981"/>
  <rect x="14" y="33" width="14" height="2" rx="1" fill="#64748b"/>
  <rect x="30" y="33" width="4" height="2" rx="1" fill="#10b981"/>
  <!-- Bank stamp badge -->
  <circle cx="34" cy="34" r="7" fill="#10b981"/>
  <path d="M31 34l2 2 4-4" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
